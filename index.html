<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pages publiques</title>
<style>
:root{--bg:#EEF1F4;--panel:#FFFFFF;--ink:#1F2A36;--muted:#5B7083;--sun:#F2B233;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141C25;--panel:#1C2733;--ink:#E8EDF2;--muted:#97A8B8;--sun:#F5BD45;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:32px 16px}
h1{font-size:1.6rem;margin:0 0 16px}
ul{list-style:none;margin:0;padding:0}
a{display:block;background:var(--panel);border-left:4px solid var(--sun);border-radius:0 12px 12px 0;padding:14px 16px;color:inherit;text-decoration:none;margin-bottom:8px}
a b{display:block}
a span{color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
  <h1>Outils</h1>
  <ul>
    <li><a href="luxmetre/"><b>Comparateur de lumière</b><span>Mesurez et comparez la luminosité de plusieurs endroits avec l'appareil photo.</span></a></li>
  </ul>
</main>
</body>
</html>
